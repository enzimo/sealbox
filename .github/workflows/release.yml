name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must be an existing tag, e.g. v0.1.5)'
        required: true

env:
  CARGO_TERM_COLOR: always

# The release is created with the workflow's own GITHUB_TOKEN. An org-owned
# repository does not necessarily grant write access by default, so request
# exactly what publishing needs rather than relying on the repo setting.
permissions:
  contents: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
    - name: Resolve version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi

    # Check out the tag being released, not the tip of the default branch.
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.version.outputs.version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Build release binaries
      run: cargo build --release --locked --all-features --workspace

    - name: Verify binary versions match the tag
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        expected="${RELEASE_VERSION#v}"
        actual=$(./target/release/sealbox-cli --version | awk '{print $2}')
        echo "tag=$expected cli=$actual"
        if [ "$expected" != "$actual" ]; then
          echo "::error::tag $RELEASE_VERSION does not match binary version $actual"
          exit 1
        fi

    - name: Assemble archive
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p release
        cp target/release/sealbox-server release/
        cp target/release/sealbox-cli release/
        cp README.md LICENSE release/
        tar czf "sealbox-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C release .
        sha256sum "sealbox-${RELEASE_VERSION}-linux-x86_64.tar.gz" > "sealbox-${RELEASE_VERSION}-linux-x86_64.tar.gz.sha256"

    - name: Publish release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Sealbox ${{ steps.version.outputs.version }}
        generate_release_notes: true
        body: |
          ## Download

          Linux x86_64 binaries (`sealbox-server` and `sealbox-cli`):

          ```
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sealbox-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          sha256sum -c sealbox-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
          tar -xzf sealbox-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          ```

          ## Quick start

          ```
          STORE_PATH=/tmp/sealbox.db \
          AUTH_TOKEN=your-secret-token \
          LISTEN_ADDR=127.0.0.1:8080 \
          ./sealbox-server
          ```

          See the [CHANGELOG](CHANGELOG.md) for details.
        files: |
          sealbox-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          sealbox-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
        fail_on_unmatched_files: true
